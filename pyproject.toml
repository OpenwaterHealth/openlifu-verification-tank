[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openlifu-verification"
version = "0.0.1"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "picosdk",
    # Pinned to openlifu-sdk main at the openlifu-sdk#111 merge, which
    # adds ``get_hardware_id(base58=True)``; move to the release tag's
    # commit once that release is tagged.
    "openlifu-sdk @ git+https://github.com/OpenwaterHealth/openlifu-sdk.git@eae6f17abe816ff6eac4eefc5795dc8e7a25545b",
    "tqdm",
    "openpyxl",
]

[project.optional-dependencies]
# ``run_report_gui`` uses PyQt6 for the launcher dialog. Kept
# optional so headless / CLI-only installs don't need it.
gui = [
    "PyQt6",
]
# Building the Windows executable (OpenLIFU-VerificationTank.spec) and
# running the test suite.
dev = [
    "pyinstaller>=6.0",
    "pytest",
]

[tool.setuptools]
packages = ["openlifu_verification"]
