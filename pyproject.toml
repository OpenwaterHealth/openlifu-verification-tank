[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openlifu-verification"
version = "0.0.1"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "picosdk",
    # openlifu-sdk 2.1.0-rc.3 (pre-release) is the first release with
    # ``get_hardware_id(base58=True)`` (openlifu-sdk#111).
    "openlifu-sdk @ git+https://github.com/OpenwaterHealth/openlifu-sdk.git@2.1.0-rc.3",
    "tqdm",
    "openpyxl",
]

[project.optional-dependencies]
# ``run_report_gui`` uses PyQt6 for the launcher dialog. Kept
# optional so headless / CLI-only installs don't need it.
gui = [
    "PyQt6",
]
# Building the Windows executable (OpenLIFU-VerificationTank.spec) and
# running the test suite.
dev = [
    "pyinstaller>=6.0",
    "pytest",
]

[tool.setuptools]
packages = ["openlifu_verification"]
