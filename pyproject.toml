[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openlifu-verification"
version = "0.0.1"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "picosdk",
    "openlifu-sdk",
    "tqdm",
    "openpyxl",
    "base58",
    # run_report_gui (QtCore / QtGui / QtWidgets / QtTest only).
    "PySide6-Essentials==6.12.0",
]

[project.optional-dependencies]
# Building the Windows executable (OpenLIFU-VerificationTank.spec) and
# running the test suite.
dev = [
    "pyinstaller>=6.0",
    "pytest",
]

[project.scripts]
openlifu-setup-data = "openlifu_verification.setup_data:main"

[tool.setuptools]
packages = ["openlifu_verification"]

[tool.setuptools.package-data]
# Template copied into the setup data folder (see setup_data.py).
openlifu_verification = ["setup_data_template/*/*"]
