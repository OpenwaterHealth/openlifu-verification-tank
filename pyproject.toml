[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openlifu-verification"
version = "0.0.1"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "picosdk",
    "openlifu-sdk",
    "tqdm",
    "openpyxl",
    "base58",
]

[project.optional-dependencies]
# ``run_report_gui`` uses PyQt6 for the launcher dialog. Kept
# optional so headless / CLI-only installs don't need it.
gui = [
    "PyQt6",
]

[tool.setuptools]
packages = ["openlifu_verification"]
